<!DOCTYPE html>
<html>
<head>
<title>Balance Summary</title>
<style type="text/css">
body { background: #ffffff; font-family: Verdana, Geneva, sans-serif; font-size: 12px; margin: 8px; }
td { font-size: 12px; }
</style>
</head>
<body>

<table border="1" cellpadding="6" cellspacing="0" width="500">
<tr bgcolor="#e8e8e8">
  <td width="200"><b>Account</b></td>
  <td width="120"><b>Currency</b></td>
  <td align="right"><b>Available Balance</b></td>
</tr>
<tr>
  <td>Savings</td>
  <td>USD</td>
  <td align="right">{{ customer.savings_balance|money }}</td>
</tr>
<tr>
  <td>Checking</td>
  <td>USD</td>
  <td align="right">{{ customer.checking_balance|money }}</td>
</tr>
</table>
<br>
<font size="1">Ledger subsystem &mdash; member {{ customer.customer_id }}</font>

</body>
</html>
