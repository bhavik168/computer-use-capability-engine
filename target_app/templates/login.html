{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h3>Operator Login</h3>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
<label for="f1">Username</label>
<input type="text" id="f1" name="username">
<label for="f2">Password</label>
<input type="password" id="f2" name="password">
<p><button class="btn" type="submit">Log In</button></p>
</form>
<p style="color:#666666">Demo credentials: operator1 / pass123</p>
{% endblock %}
