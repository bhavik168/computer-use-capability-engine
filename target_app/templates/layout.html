<!DOCTYPE html>
<html>
<head>
<title>{% block title %}Member Servicing Portal{% endblock %}</title>
<style>
body { font-family: Verdana, Geneva, Arial, sans-serif; background:#e8e8e8; margin:0;
       font-size:12px; color:#000; }
a { color:#003366; }
table.chrome { border-collapse:collapse; width:100%; }
table.chrome td { padding:0; border:0; }
td.headerbar { background:#003366; color:#ffffff; padding:10px 16px; font-size:17px;
               font-weight:bold; }
td.navbar { background:#cccccc; padding:6px 12px; font-size:11px; }
td.navbar a { margin-right:14px; }
td.content { background:#ffffff; padding:14px 16px; }
td.footerbar { background:#003366; color:#dddddd; padding:6px 16px; font-size:10px; }
table.grid { border-collapse:collapse; width:100%; margin:6px 0; }
table.grid td, table.grid th { border:1px solid #999999; padding:5px 8px; text-align:left;
                               font-size:11px; }
table.grid th { background:#cccccc; }
table.banner { border-collapse:collapse; width:100%; margin:10px 0; }
table.banner td { padding:8px 10px; font-size:11px; }
table.notice td { background:#fff3cd; border:1px solid #cccc99; }
table.deny td { background:#f8d7da; border:1px solid #cc9999; }
table.ok td { background:#d4edda; border:1px solid #99bb99; }
p.err { color:#a00000; font-weight:bold; }
.btn { background:#003366; color:#ffffff; border:1px solid #001a33; padding:5px 14px;
       cursor:pointer; font-family:Verdana, Geneva, Arial, sans-serif; font-size:11px; }
label { display:block; margin-top:8px; font-weight:bold; }
input[type=text], input[type=password] { width:280px; padding:3px;
       font-family:Verdana, Geneva, Arial, sans-serif; font-size:11px; }
</style>
</head>
<body>
<table class="chrome">
<tr><td class="headerbar">Member Servicing Portal &mdash; Credit Union Back Office</td></tr>
{% if operator %}
<tr><td class="navbar">
  <a href="{{ url_for('member_search') }}">Member Search</a>
  Signed on: {{ operator }} &mdash;
  <a href="{{ url_for('logout') }}">Logout</a>
</td></tr>
{% endif %}
<tr><td class="content">{% block content %}{% endblock %}</td></tr>
<tr><td class="footerbar">Member Servicing Portal &mdash; Credit Union Back Office</td></tr>
</table>
</body>
</html>
